[project]
name = "my-gis-package"
version = "0.1.0"
description = "Agent-based modelling tools for urban air quality analysis"
authors = [
    {name = "Your Name", email = "your.email@auckland.ac.nz"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["gis", "air-quality", "urban-geography"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
]
viz = [
    "matplotlib>=3.10.8",
    "plotly>=6.5.2",
]

[project.urls]
Homepage = "https://github.com/yourusername/my-gis-package"
Repository = "https://github.com/yourusername/my-gis-package"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=26.1.0",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]
